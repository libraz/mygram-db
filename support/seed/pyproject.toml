[project]
name = "mygramdb-seed"
version = "0.1.0"
description = "Benchmark dataset seeding and MygramDB vs MySQL FULLTEXT comparison"
authors = [
    { name = "libraz", email = "libraz@libraz.net" }
]
dependencies = [
    "mysql-connector-python>=9.5.0",
]
