version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME:-mygramdb}_mysql
    restart: unless-stopped
    environment:
      # Passwords must be set via .env file or environment variables (no defaults for security)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mydb}
      MYSQL_USER: ${MYSQL_USER:-repl_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # MygramDB reaches MySQL over the bridge network, so this publish exists
      # only so a local client can inspect the database. The host interface is
      # literal rather than variable: root credentials come from .env, and a
      # publish without it would put them on every interface the host has.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./support/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # MYSQL_PWD keeps the password in the probe's environment; a -p argument
      # would put it in /proc/<pid>/cmdline, which any UID in the same PID
      # namespace can read. $$ defers expansion until the probe runs inside the
      # container, so Compose never interpolates the value into the daemon's
      # stored service definition.
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mygramdb_network

  mygramdb:
    image: mygramdb:${MYGRAMDB_VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-mygramdb}_app
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # MySQL Configuration
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-repl_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mydb}
      MYSQL_USE_GTID: ${MYSQL_USE_GTID:-true}
      MYSQL_CONNECT_TIMEOUT_MS: ${MYSQL_CONNECT_TIMEOUT_MS:-3000}

      # Table Configuration
      TABLE_NAME: ${TABLE_NAME:-articles}
      TABLE_PRIMARY_KEY: ${TABLE_PRIMARY_KEY:-id}
      TABLE_TEXT_COLUMN: ${TABLE_TEXT_COLUMN:-content}
      TABLE_NGRAM_SIZE: ${TABLE_NGRAM_SIZE:-2}
      TABLE_KANJI_NGRAM_SIZE: ${TABLE_KANJI_NGRAM_SIZE:-0}

      # Replication Configuration
      REPLICATION_ENABLE: ${REPLICATION_ENABLE:-true}
      REPLICATION_SERVER_ID: ${REPLICATION_SERVER_ID:-12345}
      REPLICATION_START_FROM: ${REPLICATION_START_FROM:-snapshot}
      # Pairs with REPLICATION_START_FROM=snapshot. Without it the server comes
      # up with an empty index and stays not_ready until a client sends SYNC.
      REPLICATION_AUTO_INITIAL_SNAPSHOT: ${REPLICATION_AUTO_INITIAL_SNAPSHOT:-true}

      # Build Configuration
      BUILD_BATCH_SIZE: ${BUILD_BATCH_SIZE:-5000}
      BUILD_PARALLELISM: ${BUILD_PARALLELISM:-2}

      # Memory Management
      MEMORY_HARD_LIMIT_MB: ${MEMORY_HARD_LIMIT_MB:-8192}
      MEMORY_SOFT_TARGET_MB: ${MEMORY_SOFT_TARGET_MB:-4096}
      MEMORY_NORMALIZE_NFKC: ${MEMORY_NORMALIZE_NFKC:-true}
      MEMORY_NORMALIZE_WIDTH: ${MEMORY_NORMALIZE_WIDTH:-narrow}
      MEMORY_NORMALIZE_LOWER: ${MEMORY_NORMALIZE_LOWER:-false}
      MEMORY_VERIFY_TEXT: ${MEMORY_VERIFY_TEXT:-off}

      # Dump Configuration
      DUMP_DIR: ${DUMP_DIR:-/var/lib/mygramdb/dumps}
      DUMP_INTERVAL_SEC: ${DUMP_INTERVAL_SEC:-600}
      DUMP_RETAIN: ${DUMP_RETAIN:-3}

      # Relevance and cache
      BM25_ENABLE: ${BM25_ENABLE:-false}
      BM25_K1: ${BM25_K1:-1.2}
      BM25_B: ${BM25_B:-0.75}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_MAX_MEMORY_MB: ${CACHE_MAX_MEMORY_MB:-32}
      CACHE_MIN_QUERY_COST_MS: ${CACHE_MIN_QUERY_COST_MS:-10.0}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}

      # MySQL timezone/TLS
      MYSQL_DATETIME_TIMEZONE: ${MYSQL_DATETIME_TIMEZONE:-+00:00}
      MYSQL_SSL_ENABLE: ${MYSQL_SSL_ENABLE:-false}
      MYSQL_SSL_CA: ${MYSQL_SSL_CA:-}
      MYSQL_SSL_CERT: ${MYSQL_SSL_CERT:-}
      MYSQL_SSL_KEY: ${MYSQL_SSL_KEY:-}
      MYSQL_SSL_VERIFY_SERVER_CERT: ${MYSQL_SSL_VERIFY_SERVER_CERT:-true}

      # API Server Configuration
      # Containers must listen on their network interface; host-side exposure
      # is limited by the ports mapping below.
      API_BIND: ${API_CONTAINER_BIND:-0.0.0.0}
      API_PORT: ${API_PORT:-11016}
      API_HTTP_ENABLE: ${API_HTTP_ENABLE:-true}
      API_HTTP_BIND: ${API_HTTP_CONTAINER_BIND:-0.0.0.0}
      API_HTTP_PORT: ${API_HTTP_PORT:-8080}
      API_RATE_LIMIT_ENABLE: ${API_RATE_LIMIT_ENABLE:-false}
      API_RATE_LIMIT_CAPACITY: ${API_RATE_LIMIT_CAPACITY:-100}
      API_RATE_LIMIT_REFILL_RATE: ${API_RATE_LIMIT_REFILL_RATE:-10}
      API_RATE_LIMIT_MAX_CLIENTS: ${API_RATE_LIMIT_MAX_CLIENTS:-10000}
      API_ADMIN_TOKEN: ${API_ADMIN_TOKEN:?API_ADMIN_TOKEN must be set for administrative TCP commands}

      # Network Configuration
      # Matched against the address the server sees, which for a published port
      # is the bridge gateway rather than the host address, so the list has to
      # cover the bridge range. Host-side exposure is bounded by the loopback
      # ports mapping below. Do not combine a public bind with 0.0.0.0/0 or ::/0.
      # Administrative TCP commands additionally require API_ADMIN_TOKEN.
      NETWORK_ALLOW_CIDRS: ${NETWORK_ALLOW_CIDRS:?NETWORK_ALLOW_CIDRS must be set in .env}

      # Logging Configuration
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "127.0.0.1:${API_PORT:-11016}:${API_PORT:-11016}"
      - "127.0.0.1:${API_HTTP_PORT:-8080}:${API_HTTP_PORT:-8080}"
    volumes:
      - mygramdb_data:/var/lib/mygramdb
    healthcheck:
      # $$ defers expansion until the probe runs inside the container.
      test: ["CMD-SHELL", "curl -sf \"http://localhost:$${API_HTTP_PORT:-8080}/health/live\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - mygramdb_network

volumes:
  mysql_data:
    driver: local
  mygramdb_data:
    driver: local

networks:
  mygramdb_network:
    driver: bridge
