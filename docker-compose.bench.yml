# MygramDB Benchmark Environment
# Downloads and loads 1.1M Wikipedia articles for benchmarking.
#
# Usage:
#   make bench-up      # Start (first run downloads 203MB seed)
#   make bench-down    # Stop and remove volumes
#   make bench-logs    # Monitor seed loading progress

services:
  mysql:
    image: mysql:8.4
    container_name: mygramdb_bench_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mygramdb
      MYSQL_DATABASE: mydb
      MYSQL_USER: repl_user
      MYSQL_PASSWORD: mygramdb
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --local-infile=ON
      # MygramDB holds its whole index in RAM, so a MySQL left on the 128MB
      # default buffer pool would be measured on disk I/O it never had to do.
      # The pool is sized to hold the table and its FULLTEXT index outright,
      # which is the configuration a MySQL serving this dataset would actually
      # run. The benchmark reports the effective value so the published numbers
      # state what the baseline was given.
      - --innodb-buffer-pool-size=${BENCH_MYSQL_BUFFER_POOL:-8G}
      - --innodb-buffer-pool-instances=8
      # Redo capacity sized for the bulk seed load; without it the load stalls
      # on checkpoint flushing and leaves the pool cold.
      - --innodb-redo-log-capacity=2G
      - --innodb-ft-cache-size=80000000
      - --innodb-ft-total-cache-size=1600000000
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - bench_mysql_data:/var/lib/mysql
      - ./support/docker/mysql/init/01-create-tables.sql:/docker-entrypoint-initdb.d/01-create-tables.sql:ro
      - ./support/docker/mysql/bench-init/02-load-seed.sh:/docker-entrypoint-initdb.d/02-load-seed.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(mysql -u root -pmygramdb -h 127.0.0.1 -P 3306 -Nse 'SELECT COUNT(*) FROM mydb.articles')\" -ge 1100000"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - bench_network

  mygramdb:
    image: ghcr.io/libraz/mygram-db:latest
    container_name: mygramdb_bench_app
    restart: unless-stopped
    entrypoint: ["/bench-entrypoint.sh"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: repl_user
      MYSQL_PASSWORD: mygramdb
      MYSQL_DATABASE: mydb
      MYSQL_USE_GTID: "true"
      TABLE_NAME: articles
      TABLE_PRIMARY_KEY: id
      TABLE_TEXT_COLUMN: content
      TABLE_NGRAM_SIZE: "2"
      TABLE_KANJI_NGRAM_SIZE: "1"
      REPLICATION_ENABLE: "true"
      REPLICATION_SERVER_ID: "12345"
      REPLICATION_START_FROM: snapshot
      REPLICATION_AUTO_INITIAL_SNAPSHOT: "true"
      MEMORY_NORMALIZE_NFKC: "true"
      MEMORY_NORMALIZE_WIDTH: narrow
      MEMORY_NORMALIZE_LOWER: "true"
      CACHE_ENABLED: "false"
      # The container has to listen on its own network interface, so host
      # exposure is limited by the loopback ports mapping below instead. Docker
      # rewrites the source address of a published-port connection to the
      # bridge gateway, so the allow list covers the bridge range rather than
      # 127.0.0.1, which would reject every benchmark client.
      NETWORK_ALLOW_CIDRS: 127.0.0.1/32,172.16.0.0/12
      API_BIND: 0.0.0.0
      API_PORT: "11016"
      # Throwaway local stack, so this is fixed for the same reason the MySQL
      # password above is. Administrative TCP commands need AUTH with it.
      API_ADMIN_TOKEN: bench-local-only
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - "127.0.0.1:11016:11016"
    volumes:
      - bench_mygramdb_data:/var/lib/mygramdb
      - ./support/docker/bench-entrypoint.sh:/bench-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "pgrep", "-x", "mygramdb"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - bench_network

volumes:
  bench_mysql_data:
    driver: local
  bench_mygramdb_data:
    driver: local

networks:
  bench_network:
    driver: bridge
