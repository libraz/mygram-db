# MygramDB Minimal Configuration
# For all available options, see examples/config.yaml

mysql:
  host: "127.0.0.1"
  user: "repl_user"
  password: "your_password"
  database: "mydb"
  datetime_timezone: "+00:00"  # Timezone for DATETIME/DATE columns (UTC). Change to your timezone if needed (e.g., "+09:00" for JST)

tables:
  - name: "articles"
    text_source:
      column: "content"

replication:
  server_id: 83917  # MUST be unique across all instances. Generate: shuf -i 2-4294967295 -n 1

network:
  allow_cidrs:
    - "127.0.0.1/32"  # Localhost only, matching the default loopback bind
    # Widen this to the network the clients come from. Combining 0.0.0.0/0 with
    # a non-loopback bind is rejected at startup, and any non-loopback bind also
    # requires api.admin_token (see examples/config.yaml).
