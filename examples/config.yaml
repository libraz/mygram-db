# MygramDB Configuration Example
#
# This is a complete example configuration file with all available options.
# Copy this file and customize it for your environment.
#
# Documentation: https://mygramdb.libraz.net/docs/configuration (ja: https://mygramdb.libraz.net/ja/docs/configuration)
#
# Note: All configuration files (YAML and JSON) are automatically validated
# against the built-in JSON Schema at startup. Invalid settings such as
# typos, wrong types, or unknown keys will be detected and reported.

# MySQL Connection Settings
mysql:
  host: "127.0.0.1"                 # MySQL server hostname or IP (default: 127.0.0.1)
  port: 3306                        # MySQL server port (default: 3306)
  user: "repl_user"                 # MySQL username for replication
  password: "your_password_here"    # MySQL user password
  database: "mydb"                  # Database name
  use_gtid: true                    # Required: GTID replication is the only supported mode
  binlog_format: "ROW"              # Binary log format (default: ROW, required for replication)
  binlog_row_image: "FULL"          # Row image format (default: FULL, required for replication)
                                    # MariaDB also requires log_bin_compress=OFF; startup fails closed otherwise
  connect_timeout_ms: 3000          # Connection timeout in milliseconds (default: 3000)
  session_timeout_sec: 3600         # Session timeout in seconds (default: 3600 = 1 hour)
                                    # Prevents disconnection during long operations like snapshot building
  datetime_timezone: "+00:00"       # DATETIME/DATE and TIMESTAMP required-filter literal timezone
                                    # Format: [+-]HH:MM (e.g., "+09:00" for JST, "-05:00" for EST)
                                    # TIMESTAMP SELECT/storage/binlog values use UTC epoch seconds
  # SSL/TLS settings (optional but highly recommended for production)
  # With ssl_enable false the client requests the server's RSA key to send the
  # password, so an attacker able to sit on the connection can substitute a key
  # of their own and recover it. Leave it false only on a trusted network.
  ssl_enable: false                 # Enable SSL/TLS (default: false)
  # ssl_ca: "/path/to/ca-cert.pem" # CA certificate for SSL/TLS
  # ssl_cert: "/path/to/client-cert.pem" # Client certificate
  # ssl_key: "/path/to/client-key.pem"   # Client private key
  # ssl_verify_server_cert: true   # Verify server certificate (default: true)

# Table Configuration (supports multiple tables)
tables:
  - name: "articles"                # Table name in MySQL database
    primary_key: "id"               # Primary key column name (default: id)
                                    # Must be single-column PRIMARY KEY or UNIQUE KEY
                                    # Validated against actual MySQL table schema at startup

    # Text Source Configuration
    # Option 1: Single column
    text_source:
      column: "content"             # Column to index for full-text search
      delimiter: " "                # Delimiter for concatenation (default: " ", used when concat is specified)

    # Option 2: Multiple columns (concatenated)
    # Uncomment to use multiple columns:
    # text_source:
    #   concat: ["title", "body"]   # Columns to concatenate
    #   delimiter: " "              # Delimiter for concatenation

    # Required Filters (data existence conditions)
    # Data that does not match these conditions will NOT be indexed
    # During binlog replication:
    #  - Data transitioning OUT of these conditions will be REMOVED from index
    #  - Data transitioning INTO these conditions will be ADDED to index
    required_filters:
      - name: "enabled"             # Filter column name
        type: "int"                 # Column type (same options as filters)
        op: "="                     # Operator: "=", "!=", "<", ">", "<=", ">=", "IS NULL", "IS NOT NULL"
        value: 1                    # Comparison value (omit for IS NULL/IS NOT NULL)
        bitmap_index: false         # Reserved / not yet enforced

      - name: "deleted_at"
        type: "datetime"
        op: "IS NULL"               # Only index non-deleted records
        bitmap_index: false

    # Optional Filters (search-time filtering)
    # These filters are used for filtering during searches
    # They do NOT affect which data is indexed
    filters:
      - name: "status"              # Filter column name
        type: "int"                 # Column type (see docs for all types)
        dict_compress: false        # Reserved / not yet enforced
        bitmap_index: false         # Reserved / not yet enforced

      - name: "category"
        type: "string"
        dict_compress: false
        bitmap_index: false

      - name: "created_at"
        type: "datetime"
        # bucket: "minute"          # Reserved / not yet enforced

    # N-gram Configuration
    ngram_size: 2                   # N-gram size for ASCII/alphanumeric characters (default: 2)
                                    # 1=unigram, 2=bigram, etc.
                                    # For mixed-language content: recommended 2
    kanji_ngram_size: 0             # N-gram size for CJK (kanji/kana/hanzi) characters (default: 0 = use ngram_size)
                                    # Set to 0 to use ngram_size for all characters

    # Posting List Configuration (reserved / not yet enforced)
    posting:
      block_size: 128
      freq_bits: 0
      use_roaring: "auto"

    # Synonym expansion (optional). When enabled, file is mandatory and startup
    # fails if the complete TSV cannot be loaded; the previous dictionary is
    # retained on a runtime reload failure.
    synonyms:
      enable: false
      # file: "/etc/mygramdb/synonyms.tsv"

  # Example: Second table (uncomment to enable multi-table mode)
  # - name: "products"
  #   primary_key: "product_id"
  #   text_source:
  #     concat: ["name", "description"]
  #     delimiter: " "
  #   ngram_size: 2
  #   kanji_ngram_size: 1
  #   posting:
  #     block_size: 128
  #     freq_bits: 0
  #     use_roaring: "auto"

# Index Build Configuration
build:
  mode: "select_snapshot"           # Build mode (default: select_snapshot, currently only option)
  batch_size: 5000                  # Rows per batch during snapshot (default: 5000)
  parallelism: 2                    # Reserved / not yet enforced (default: 2)
  throttle_ms: 0                    # Reserved / not yet enforced (default: 0)

# Replication Configuration
replication:
  enable: true                      # Enable binlog replication (default: true)
  auto_initial_snapshot: false      # Automatically build snapshot on startup (default: false)
                                    # When false: Use SYNC command to manually trigger snapshot synchronization
                                    # When true: Automatically build snapshot on startup (legacy behavior)
                                    # Setting to false prevents unexpected MySQL load on startup
  server_id: 83917                  # MUST be unique across all instances. Generate: shuf -i 2-4294967295 -n 1

  # Replication start position
  # - "snapshot": Start from snapshot GTID (recommended, ensures consistency)
  # - "latest": Start from current GTID (only new changes)
  # - "gtid=<UUID:txn>": Start from specific GTID (e.g., gtid=3E11FA47-71CA-11E1-9E33-C80AA9429562:1)
  start_from: "snapshot"            # Default: snapshot

  queue_size: 10000                 # Binlog event queue size (default: 10000)
  reconnect_backoff_min_ms: 500     # Reserved / not yet enforced (default: 500)
  reconnect_backoff_max_ms: 10000   # Reserved / not yet enforced (default: 10000)

# Memory Management
memory:
  hard_limit_mb: 8192               # Reserved / not yet enforced (default: 8192)
  soft_target_mb: 4096              # Reserved / not yet enforced (default: 4096)
  arena_chunk_mb: 64                # Reserved / not yet enforced (default: 64)
  roaring_threshold: 0.18           # Roaring bitmap threshold (default: 0.18)
  minute_epoch: true                # Use minute-precision epoch (default: true)

  # Text Normalization
  normalize:
    nfkc: true                      # NFKC normalization (default: true, recommended for Japanese)
    width: "narrow"                 # Width conversion: "keep", "narrow", "wide" (default: narrow)
    lower: false                    # Lowercase conversion (default: false)

  # Post-filter verification mode for n-gram false positive elimination
  # N-gram indexing can produce false positives (e.g., "quantum" matching
  # "quantity antique stump" because all bigrams exist). This setting
  # verifies search results against stored normalized text.
  #   "off"   - No verification (fastest, default, may include false positives)
  #   "ascii" - Verify only ASCII queries (good balance for English content)
  #   "all"   - Verify all queries (most accurate, higher memory usage)
  # Memory impact: "off" ~414MB/M docs, "all" ~2.2GB/M docs
  verify_text: "off"

# BM25 relevance scoring
# SORT _score requires both bm25.enable=true and stored normalized text, which
# means memory.verify_text must be "ascii" or "all".
bm25:
  enable: false                     # Enable relevance scoring (default: false)
  k1: 1.2                           # Term-frequency saturation (default: 1.2)
  b: 0.75                           # Document-length normalization (default: 0.75)

# Dump Persistence (Automatic Backup)
dump:
  dir: "/var/lib/mygramdb/dumps"    # Dump directory path (default: /var/lib/mygramdb/dumps)
                                     # - Created automatically if doesn't exist
                                     # - Write permissions verified at startup
  default_filename: "mygramdb.dmp"  # Default filename for manual DUMP SAVE (default: mygramdb.dmp)
  load_on_startup: false             # Restore default_filename first; fall back to MySQL snapshot on failure
  interval_sec: 0                   # Auto-save interval in seconds (0 = disabled, default: 0)
                                     # - Set to 7200 for 120-minute intervals (recommended)
                                     # - Auto-saved files: auto_YYYYMMDD_HHMMSS.dmp
                                     # - Similar to Redis RDB persistence
  retain: 3                         # Number of auto-saved dumps to retain (default: 3)
                                     # - Older auto-saved files are cleaned up automatically
                                     # - Manual dumps (via DUMP SAVE) are not affected
  restore_memory_budget_mb: 4096    # Max aggregate memory for staged V2 restore data
  restore_max_section_mb: 2048      # Max encoded size of one V2 section

# API Server Configuration
api:
  tcp:
    bind: "127.0.0.1"               # TCP bind address (default: loopback only)
    port: 11016                     # TCP port (default: 11016)
    max_connections: 10000          # Maximum concurrent connections (default: 10000)
                                    # SECURITY: Prevents file descriptor exhaustion and resource starvation
                                    # - Connections exceeding this limit are immediately rejected
                                    # - Set based on system ulimit -n and available memory
                                    # - Production recommendation: system ulimit / 2
    thread_pool_queue_size: 1000    # Pending worker tasks; 0 = truly unbounded (not recommended in production)
    max_write_queue_bytes: 16777216 # Per-connection unsent response cap (16 MiB)
    max_total_buffered_bytes: 268435456 # Shared pending-request + response cap (256 MiB)
  unix_socket:
    path: ""                          # Unix domain socket path (default: "" = disabled)
                                      # Set to enable local connections without TCP overhead
                                      # Example: "/tmp/mygramdb.sock"
  http:
    enable: false                   # Enable HTTP/JSON API (default: false)
                                     # - Set to true to enable HTTP API
                                     # - TCP API is always enabled
    bind: "127.0.0.1"               # HTTP bind address (default: 127.0.0.1)
    port: 8080                      # HTTP port (default: 8080)
    max_connections: 10000          # Maximum concurrent HTTP connections (default: 10000)
    trusted_proxies: []             # Proxy IPs allowed to supply X-Forwarded-For
    enable_cors: false              # Enable CORS headers for browser clients (default: false)
    cors_allow_origin: ""           # Origin allowed when CORS is enabled (e.g., "https://app.example.com")
    max_body_bytes: 16777216        # Maximum HTTP request body size in bytes (16 MiB)
  # admin_token: ""                 # Shared secret for administrative TCP commands (AUTH <token>)
                                    # SECURITY: REQUIRED when any listener binds a non-loopback
                                    # address; the server refuses to start without it.
                                    # Generate with: openssl rand -hex 32
                                    # Prefer supplying it through MYGRAM_API_ADMIN_TOKEN so the
                                    # secret never lands in this file.
  default_limit: 100                # Default LIMIT when not specified (range 5-1000)
  max_query_length: 128             # Max query expression length (0 = unlimited)

  # Rate Limiting (optional, disabled by default)
  rate_limiting:
    enable: false                   # Enable rate limiting (default: false)
                                    # - Uses token bucket algorithm per client IP
                                    # - Protects against DoS attacks and resource exhaustion
    capacity: 100                   # Maximum tokens per client (burst size) (default: 100)
                                    # - Allows burst of up to N requests before throttling
    refill_rate: 10                 # Tokens added per second per client (default: 10)
                                    # - Sustained rate limit: N requests/second per IP
    max_clients: 10000              # Maximum number of tracked clients (default: 10000)
                                    # - Memory management: prevents tracking too many IPs

# Network Security (REQUIRED for production)
# SECURITY: Empty allow_cidrs will DENY all connections by default (fail-closed)
# You MUST explicitly configure allowed IP ranges
network:
  allow_cidrs:                      # Allow CIDR list applied to TCP/HTTP
    - "127.0.0.1/32"                # Localhost only, matching the loopback bind above
    # - "192.168.1.0/24"            # Example: Local network
    # - "10.0.0.0/8"                # Example: Private network
    # - "172.16.0.0/12"             # Example: Docker bridge range (see docker-compose.yml)
    # - "0.0.0.0/0"                 # Allow all: development only. Combining this with a
    #                               # non-loopback bind is rejected at startup.

# Logging Configuration
logging:
  level: "info"                     # Log level: "debug", "info", "warn", "error" (default: info)
  format: "json"                    # Structured log format: "json" or "text" (default: json)
                                     # - "json": {"event":"name","field":"value"} - best for log aggregation (Elasticsearch, Splunk)
                                     # - "text": event=name field=value - best for human reading
  file: ""                          # Log file path (default: "" = stdout)
                                     # - Empty string: log to stdout (systemd/Docker)
                                     # - Path: log to file (e.g., "/var/log/mygramdb/mygramdb.log")
                                     # - Required when using -d/--daemon option

# Query Result Cache Configuration (optional)
cache:
  enabled: true                     # Enable query result cache (default: true)
  max_memory_mb: 32                 # Shared entry/container/invalidation budget in MB (default: 32)
                                    # INFO/Prometheus expose the accounted total for comparison
  min_query_cost_ms: 10.0           # Minimum query cost to cache in milliseconds (default: 10.0)
                                    # Only cache queries that take longer than this threshold
  ttl_seconds: 3600                 # Cache entry TTL in seconds (default: 3600 = 1 hour, 0 = no TTL)
  invalidation_strategy: "ngram"    # "table" is reserved / not yet enforced (default: "ngram")
                                    # - "ngram": Invalidate based on n-gram overlap (precise, efficient)
                                    # - "table": Accepted for forward compatibility, not yet enforced

  # Advanced tuning (optional)
  compression_enabled: true         # Enable LZ4 compression for cached results (default: true)
  eviction_batch_size: 10           # Maximum entries evicted per capacity pass (default: 10)

  # Invalidation queue settings (optional)
  invalidation:
    batch_size: 1000                # Process invalidation after N unique cache-entry identities (default: 1000)
    max_delay_ms: 100               # Maximum delay before processing invalidation in milliseconds (default: 100)
    max_queue_size: 100000          # Maximum pending identities before deferred cleanup backpressure (default: 100000)
