name: Develop CI

on:
  push:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'CMakeLists.txt'
              - 'third_party/**'
              - 'Makefile'
              - 'support/dev/**'
              - '.github/workflows/develop-ci.yml'

  linux-build:
    name: Linux Build and Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # The steps below diff against the commit this push started from, which
        # a depth-1 clone does not contain. Without it the diff resolved to
        # nothing, so no test and no clang-tidy check ever ran here.
        fetch-depth: 0

    - name: Cache CMake dependencies
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: ${{ runner.os }}-cmake-deps-${{ hashFiles('CMakeLists.txt', 'third_party/**') }}
        restore-keys: |
          ${{ runner.os }}-cmake-deps-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Cache LLVM installation
      id: cache-llvm
      uses: actions/cache@v4
      with:
        path: |
          /usr/lib/llvm-18
          /usr/bin/clang-format-18
          /usr/bin/clang-tidy-18
        key: ${{ runner.os }}-llvm-18

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libmysqlclient-dev \
          libicu-dev \
          libreadline-dev \
          pkg-config \
          ccache \
          jq

    - name: Install LLVM/Clang 18
      if: steps.cache-llvm.outputs.cache-hit != 'true'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 18
        sudo apt-get install -y clang-format-18 clang-tidy-18

    - name: Setup LLVM alternatives
      run: |
        sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
        sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100

    - name: Check code formatting
      run: make format-check

    - name: Setup ccache
      run: |
        ccache --set-config=max_size=500M
        ccache --zero-stats

    - name: Configure CMake
      env:
        CC: ccache gcc
        CXX: ccache g++
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=ON \
              -DUSE_ICU=ON \
              -DUSE_MYSQL=ON \
              -DMYGRAMDB_PORTABLE_BUILD=ON \
              ..

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Show ccache statistics
      run: ccache --show-stats

    # Both steps below have to agree on what this push changed, so the base is
    # resolved once here. `github.event.before` is the zero SHA when the branch
    # is new and names a discarded commit after a force push; the tip commit is
    # the best available stand-in for either case.
    - name: Resolve the range this push introduced
      env:
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        if [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
           && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
          echo "DIFF_BASE=$PUSH_BEFORE" >> "$GITHUB_ENV"
        else
          echo "Push start commit unavailable; comparing against the tip's parent."
          echo "DIFF_BASE=$(git rev-parse HEAD~1)" >> "$GITHUB_ENV"
        fi

    - name: Run tests for changed files
      run: bash support/dev/test-diff.sh "$DIFF_BASE" "$GITHUB_SHA" --verbose

    # Not `--diff origin/develop`: this workflow runs on a push to develop, so
    # by the time it starts origin/develop is the commit under test and the
    # diff against it is empty by construction.
    - name: Run clang-tidy (diff mode)
      run: bash support/dev/run-clang-tidy.sh --diff "$DIFF_BASE"

    - name: Upload build artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-linux
        path: |
          build/CMakeFiles/*.log
          build/Testing/Temporary/
